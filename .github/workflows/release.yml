name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Assemble release bundle
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./manifest.json').version")" = "$VERSION"
          BUNDLE="release/obsidian-anki-bridge"
          mkdir -p "$BUNDLE/licenses"
          cp main.js manifest.json styles.css README.md LICENSE "$BUNDLE/"
          cp node_modules/pdfjs-dist/legacy/build/pdf.worker.min.mjs "$BUNDLE/"
          cp node_modules/html-to-image/LICENSE "$BUNDLE/licenses/html-to-image-MIT.txt"
          cp node_modules/markdown-it/LICENSE "$BUNDLE/licenses/markdown-it-MIT.txt"
          cp node_modules/pdfjs-dist/LICENSE "$BUNDLE/licenses/pdfjs-dist-Apache-2.0.txt"
          cd release
          zip -r "obsidian-anki-bridge-${VERSION}.zip" obsidian-anki-bridge
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            main.js manifest.json styles.css \
            node_modules/pdfjs-dist/legacy/build/pdf.worker.min.mjs \
            "release/obsidian-anki-bridge-${VERSION}.zip" \
            --title "Obsidian Anki Bridge ${VERSION}" \
            --generate-notes \
            --verify-tag
